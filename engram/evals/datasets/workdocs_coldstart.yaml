      alternatives did it consider and set aside?
    task: null
  metadata:
    anchor_page_id: hub.memory-thread
    kind: coldstart
    difficulty: medium
  expected_output:
    answer: >-
      Decided 2026-08-08 (fork 2) — the unit of memory is the note layer, piloted on the two live
