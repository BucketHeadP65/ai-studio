- name: coldstart.judges-decisions-0
  inputs:
    question: >-
      What did the judges/operators thread decide about the tool environments its golden-set suite
      runs against, and on what date?
    task: null
  metadata:
    anchor_page_id: bs.judges-operators-telemetry
    kind: coldstart
    difficulty: medium
  expected_output:
    answer: >-
      Tiered, decided 2026-08-08 — frozen fakes and recorded fixtures for the regression suite
      (comparable baselines, reusing the fakes-over-mocks infrastructure), plus a small live-tool
      canary on top whose distinct purpose is measuring the fidelity gap between frozen and live
      environments rather than agent regression, so environment drift becomes an operator metric
      and a stale fixture set becomes detectable instead of silently misleading.
