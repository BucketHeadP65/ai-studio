version: 2
# A limit of 0 turns version-update pull requests off, because packages are upgraded locally in one pass.
# Security updates ignore this limit and still open pull requests.
updates:
  - package-ecosystem: "uv"
    directory: "/core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      core-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/engram"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      engram-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/studio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      studio-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/harness"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      harness-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "uv"
    directory: "/connectors"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      connectors-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/studio-client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      studio-client-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/engram/docker/postgres"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      postgres-image:
        patterns:
          - "*"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker-compose"
    directory: "/engram"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      engram-compose:
        patterns:
          - "*"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "docker-compose"
    directory: "/harness"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      harness-compose:
        patterns:
          - "*"
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
