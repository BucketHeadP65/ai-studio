cases:
- name: the standup list keeps unowned items and the meeting list names owners
  inputs:
    change:
      step: extract_actions
      step_id: st.extract_actions.v3
      step_yaml: |
        inputs:
          transcript:
            json_schema:
              type: string
        instructions: Read the meeting transcript and list every action item agreed, one line each, naming who owns it and when it is due. Leave out an item nobody owns.
        name: extract_actions
        output:
          json_schema:
            type: string
      adopted:
      - workflow_id: wf.meeting-actions.v1
        outcome: adopted
        reason: The new version names who owns each item, which is what the team message is for, and its contract check passes.
        nodes:
        - extract
        diff: |-
          --- wf.meeting-actions.v1 extract_actions
          +++ st.extract_actions.v3
          @@ -2,7 +2,7 @@
             transcript:
               json_schema:
                 type: string
          -instructions: Read the meeting transcript and list every action item agreed, one line each.
          +instructions: Read the meeting transcript and list every action item agreed, one line each, naming who owns it and when it is due. Leave out an item nobody owns.
           name: extract_actions
           output:
             json_schema:
        presentation:
          purpose: Send the team each meeting's action items with who owns each one, so every item has someone to chase it.
          produces: One message to the team listing each action item and its owner.
          owner_participation: ''
          not_for: ''
          inputs: []
          result_fields: []
          actions: []
        intent:
          request: After each meeting, tell the team what was agreed and who is doing it.
          expected_result: ''
          success_example: ''
          empty_input_behavior: ''
          failure_behavior: ''
          trigger: manual
          assumptions: []
      kept:
      - workflow_id: wf.standup-actions.v1
        outcome: kept
        reason: The new version leaves out items nobody owns, and the standup list must keep every item raised until the weekly
          review gives it an owner.
        nodes:
        - extract
        diff: |-
          --- wf.standup-actions.v1 extract_actions
          +++ st.extract_actions.v3
          @@ -2,7 +2,7 @@
             transcript:
               json_schema:
                 type: string
          -instructions: Read the meeting transcript and list every action item agreed, one line each.
          +instructions: Read the meeting transcript and list every action item agreed, one line each, naming who owns it and when it is due. Leave out an item nobody owns.
           name: extract_actions
           output:
             json_schema:
        presentation:
          purpose: Keep every action item raised in the daily standup, owned or not, so nothing raised is lost before the
            weekly review.
          produces: A running list of every item raised at standup, owned or not.
          owner_participation: ''
          not_for: ''
          inputs: []
          result_fields: []
          actions: []
        intent:
          request: Keep a list of everything raised at standup so the weekly review can give the unowned ones an owner.
          expected_result: ''
          success_example: ''
          empty_input_behavior: ''
          failure_behavior: ''
          trigger: manual
          assumptions: []
      proposal: ''
      step_files: []
      file_edits: []
  evaluators:
  - LLMJudge:
      rubric: step, step_id, step_yaml, adopted and kept are exactly as in the input. The proposal drafts either a new version
        of extract_actions with a parameter that keeps or leaves out items nobody owns, saying wf.meeting-actions.v1 leaves
        them out and wf.standup-actions.v1 keeps them, or a split into two named steps, saying which consumer runs which.
        step_files holds at least one file whose path is steps/<step name with hyphens>.md and whose text is a step file with
        frontmatter holding title, summary, version and step, a changed extract_actions at version 4 whose step is step_yaml
        with only the parameter and what it decides changed. file_edits names each consumer workflow the change touches.
      model: gateway/openai:gpt-5.4
      include_input: true
